# Builds the auth service container, pushes it to ACR, and points the Azure Web App at the new image.
# Auth to Azure is OIDC (federated credential on the github-wonrich-auth-deploy app registration),
# so no long-lived secret is stored in GitHub.

name: Build and deploy auth service container to Azure Web App - wonrich-auth-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  ACR_NAME: wonrichauthcontainer
  IMAGE_NAME: wonrich-auth
  WEBAPP_NAME: wonrich-auth-app
  RESOURCE_GROUP: wonrich-auth-app_group

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name "$ACR_NAME"

      - name: Build and push image
        run: |
          IMAGE="$ACR_NAME.azurecr.io/$IMAGE_NAME"
          docker build -t "$IMAGE:${{ github.sha }}" -t "$IMAGE:latest" .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"

      # Deploys the immutable sha tag (not :latest) so the running image is always traceable to a commit.
      - name: Point web app at new image
        run: |
          az webapp sitecontainers update \
            --name "$WEBAPP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --container-name main \
            --image "$ACR_NAME.azurecr.io/$IMAGE_NAME:${{ github.sha }}"

      - name: Restart web app
        run: az webapp restart --name "$WEBAPP_NAME" --resource-group "$RESOURCE_GROUP"
